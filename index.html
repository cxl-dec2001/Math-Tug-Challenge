<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math Tug-of-War!｜第十版修正版</title><style>
:root{font-family:'Noto Sans TC',system-ui,sans-serif;color:#29344b;background:#f5f8fc}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:18px}h1{text-align:center;margin:12px 0 6px;font-size:clamp(25px,4vw,39px)}.sub{text-align:center;color:#68778b;margin:0 0 18px}.settings,.arena,.panel,.result{background:white;border-radius:22px;box-shadow:0 5px 22px #263e5b13}.settings{padding:18px;display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:center}.field{display:grid;gap:5px;font-weight:700}.field select{padding:11px;border:2px solid #dce4ef;border-radius:12px;font-size:16px;background:white}.start,.again{background:#3b75d9;color:white;border:0;padding:13px 25px;border-radius:13px;font-size:17px;font-weight:800;cursor:pointer}.arena{margin:18px 0;padding:18px;text-align:center}.score{display:flex;justify-content:space-between;font-weight:900;font-size:clamp(16px,2.6vw,24px)}.blue{color:#2379c5}.red{color:#e45d5d}.clock{font-size:22px;font-weight:900;background:#fff3cf;padding:7px 22px;border-radius:40px;display:inline-block}.stage{position:relative;height:140px;margin:14px 0 4px;background:linear-gradient(#f1f9ff,#fff);border-radius:18px;overflow:hidden}.mid{position:absolute;left:50%;height:100%;border-left:3px dashed #a9b9ce}.rope{position:absolute;left:15%;right:15%;top:74px;height:7px;border-radius:10px;background:repeating-linear-gradient(90deg,#b58c59 0 12px,#e0b780 12px 18px)}.marker{position:absolute;top:61px;left:50%;height:34px;width:12px;border-radius:4px;background:#f4b942;transform:translateX(-50%);transition:left .35s}.team{position:absolute;top:15px;font-size:56px;transition:transform .35s}.team.left{left:14%}.team.right{right:14%}.hint{font-size:14px;color:#72819a}.boards{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{padding:18px;border:3px solid #c7e6ff}.panel.right{border-color:#ffd1d1}.panel h2{text-align:center;margin:0 0 12px}.question{text-align:center;font-size:clamp(30px,5vw,48px);font-weight:900;padding:12px;border-radius:15px;background:#e9f5ff;color:#1873b9}.right .question{background:#fff0f0;color:#dc5555}.answer{margin:10px auto;border:2px solid #dce4ed;border-radius:12px;text-align:center;min-height:53px;line-height:49px;font-size:30px;font-weight:800;max-width:250px}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.keys button{border:0;background:#f0f4fa;border-radius:12px;padding:12px 0;font-size:23px;font-weight:800;cursor:pointer;touch-action:manipulation}.keys button:active{transform:scale(.95)}.keys .clear{background:#ffe2df;color:#c34236}.keys .ok{background:#2d91d0;color:white}.right .keys .ok{background:#e26a6a}.status{text-align:center;min-height:24px;font-weight:700;color:#60758e}.result{display:none;position:fixed;z-index:5;top:50%;left:50%;transform:translate(-50%,-50%);padding:35px;text-align:center;width:min(90vw,450px);box-shadow:0 0 0 100vmax #172a4c99}.result h2{font-size:33px}.result p{font-size:20px}.hide{display:none!important}@media(max-width:600px){main{padding:9px}.settings{padding:12px}.boards{gap:8px}.panel{padding:9px;border-radius:15px}.keys{gap:5px}.keys button{padding:11px 0}.stage{height:115px}.team{font-size:39px}.arena{padding:10px}.panel h2{font-size:18px}}

.settings{display:grid;grid-template-columns:1fr 1fr;align-items:stretch;gap:14px}.choices{min-width:0}.choices strong{display:block;margin-bottom:8px}.options{display:flex;flex-wrap:wrap;gap:7px}.options button{border:2px solid #d7e0ec;border-radius:12px;background:#f6f8fc;color:#30415b;padding:12px 14px;font-size:16px;font-weight:800;cursor:pointer;min-height:48px;touch-action:manipulation}.options button.selected{background:#dcecff;border-color:#3b75d9;color:#175aab}.start{grid-column:1/-1}.keys button{min-height:54px;user-select:none;-webkit-user-select:none;touch-action:manipulation}.panel{min-width:0}.panel .question{white-space:nowrap}.computer-note{font-weight:800;color:#c25353;text-align:center;padding:12px}.stage{touch-action:manipulation}@media(max-width:650px){.settings{grid-template-columns:1fr}.options button{flex:1 1 auto}.boards{gap:7px}.panel{padding:7px}.question{font-size:clamp(19px,5vw,38px)!important}.keys button{min-height:49px;padding:7px 0;font-size:21px}.answer{font-size:25px}}

.panel{position:relative;overflow:hidden}.feedback-flash{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:3;opacity:0}.feedback-flash.show{animation:feedbackPop .65s ease-out forwards}.feedback-symbol{font-size:clamp(80px,13vw,160px);font-weight:1000;line-height:1;filter:drop-shadow(0 4px 5px #0002)}.feedback-flash.correct .feedback-symbol{color:#20b35b}.feedback-flash.wrong .feedback-symbol{color:#e83d45}@keyframes feedbackPop{0%{opacity:0;transform:scale(.65)}20%{opacity:1;transform:scale(1.12)}55%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}@media(prefers-reduced-motion:reduce){.feedback-flash.show{animation:feedbackPop .65s linear forwards}}

/* 電腦對戰：保留上方左右拔河，將下方玩家答題區延展至整列 */
.boards.cpu-layout .panel:first-child{display:none!important}
.boards.cpu-layout{grid-template-columns:minmax(0,1fr)}
.boards.cpu-layout #rightPanel{grid-column:1/-1;width:100%;padding:clamp(14px,3vw,28px)}
.boards.cpu-layout #qR{font-size:clamp(38px,6vw,70px)!important;padding:20px}
.boards.cpu-layout #aR{max-width:100%;font-size:clamp(34px,5vw,54px);min-height:68px;line-height:64px}
.boards.cpu-layout #keysR{grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1.6vw,16px)}
.boards.cpu-layout #keysR button{min-height:clamp(64px,8vw,94px);font-size:clamp(27px,4vw,43px)}
.boards.solo-layout{grid-template-columns:minmax(0,1fr)}
.boards.solo-layout .panel:first-child{grid-column:1/-1}
/* 整條繩子、中央標記及拉繩隊伍同步位移 */
.tug-group{position:absolute;inset:0;transform:translateX(0);transition:transform .38s cubic-bezier(.2,.75,.3,1);will-change:transform}
.tug-group .rope{left:4%;right:4%;top:74px;height:9px;box-shadow:0 2px 3px #6c4a2b44}
.tug-group .marker{left:50%;top:60px;transition:none}
.tug-group .team{transition:none;top:13px}
.tug-group .team.left{left:6%}.tug-group .team.right{right:6%}
@media(max-width:600px){.tug-group .rope{top:67px}.tug-group .marker{top:53px}.tug-group .team{top:18px}}
</style></head><body><main><h1>🪢 十以內加減法・拔河 PK</h1><p class="sub">算得快、答得對，把繩子拉向自己！</p><div class="settings">
<div class="choices"><strong>🎮 遊戲模式</strong><div class="options" data-group="mode"><button data-value="duo" class="selected">👥 雙人 PK</button><button data-value="cpu">🤖 電腦與單人 PK</button><button data-value="solo">⭐ 個人挑戰</button></div></div>
<div class="choices"><strong>➕➖ 題目類型</strong><div class="options" data-group="type"><button data-value="add" class="selected">加法</button><button data-value="sub">減法</button><button data-value="mix">加減混合</button></div></div>
<div class="choices"><strong>⏱️ 遊戲時間</strong><div class="options" data-group="duration"><button data-value="30" class="selected">30 秒</button><button data-value="45">45 秒</button><button data-value="60">60 秒</button><button data-value="90">90 秒</button><button data-value="120">120 秒</button></div></div>
<div class="choices" id="difficultyGroup"><strong>🤖 電腦難度</strong><div class="options" data-group="difficulty"><button data-value="easy">簡單</button><button data-value="normal" class="selected">普通</button><button data-value="hard">困難</button></div></div>
<button class="start" id="start">▶ 開始遊戲</button></div><section class="arena"><div class="score"><span class="blue" id="scoreL">🔵 藍隊：0</span><span class="clock" id="clock">01:00</span><span class="red" id="scoreR">🔴 紅隊：0</span></div><div class="stage"><div class="mid"></div><div class="tug-group" id="tugGroup"><div class="rope"></div><div class="marker" id="marker"></div><div class="team left" id="teamL">👦🏻👧🏼</div><div class="team right" id="teamR">👧🏻👦🏼</div></div></div><div class="hint" id="tip">選擇模式後，按「開始遊戲」！每答對一題，就往自己方向拉一步。</div></section><section class="boards" id="boards"><div class="panel"><div class="feedback-flash" id="flashL" aria-hidden="true"><span class="feedback-symbol"></span></div><h2 class="blue" id="nameL">🔵 玩家一</h2><div class="question" id="qL">? + ? = ?</div><div class="answer" id="aL">　</div><div class="keys" id="keysL"></div><div class="status" id="sL">準備開始</div></div><div class="panel right" id="rightPanel"><div class="feedback-flash" id="flashR" aria-hidden="true"><span class="feedback-symbol"></span></div><h2 class="red" id="nameR">🔴 玩家二</h2><div class="question" id="qR">? − ? = ?</div><div class="answer" id="aR">　</div><div class="keys" id="keysR"></div><div class="status" id="sR">準備開始</div></div></section></main><div class="result" id="result"><h2 id="resultTitle">遊戲結束</h2><p id="resultText"></p><button class="again" id="again">再玩一次 ↻</button></div><script>
const $=id=>document.getElementById(id);
const config={mode:'duo',type:'add',duration:'30',difficulty:'normal'};
let audioCtx=null;function playSound(correct){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume();const now=audioCtx.currentTime;const notes=correct?[{f:523,t:0,d:.11},{f:659,t:.11,d:.11},{f:784,t:.22,d:.19}]:[{f:310,t:0,d:.16},{f:220,t:.17,d:.23}];notes.forEach(n=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=correct?'sine':'triangle';o.frequency.setValueAtTime(n.f,now+n.t);g.gain.setValueAtTime(.0001,now+n.t);g.gain.exponentialRampToValueAtTime(.13,now+n.t+.015);g.gain.exponentialRampToValueAtTime(.0001,now+n.t+n.d);o.connect(g);g.connect(audioCtx.destination);o.start(now+n.t);o.stop(now+n.t+n.d+.02)})}catch(e){}}
let active=false,remaining=30,timer=null,cpuTimer=null,mode='solo',scores=[0,0],pos=0,questions=[null,null],inputs=['',''];
const rand=n=>Math.floor(Math.random()*n);
// 每一局重新隨機洗牌。每 100 題最多 3 題涉及 0；其餘優先抽取較具挑戰性的算式。
// 題目在該類題庫抽完之前不重複；每次開始遊戲都會重新隨機排序。
let decks=[[],[]],recentAnswers=[[],[]],recentProblems=[[],[]],mixNext=['add','sub'];
let drawCounts=[0,0],zeroCounts=[0,0],globalRecent=[],zeroSlots=[[],[]];
function makeZeroSlots(){return shuffle(Array.from({length:100},(_,i)=>i)).slice(0,3)}
function shuffle(items){for(let k=items.length-1;k>0;k--){const j=rand(k+1);[items[k],items[j]]=[items[j],items[k]]}return items}
function buildPool(type){const pool=[];for(let a=0;a<=10;a++)for(let b=0;b<=10;b++){
 if(type==='add'&&a+b<=10)pool.push({txt:`${a} + ${b} = ?`,ans:a+b,kind:type,zero:a===0||b===0,core:a>=2&&b>=2});
 if(type==='sub'&&a>=b)pool.push({txt:`${a} − ${b} = ?`,ans:a-b,kind:type,zero:a===0||b===0,core:b>=2&&a-b>=2});
}return shuffle(pool)}
function question(i){
 let t=config.type;
 if(t==='mix'){t=mixNext[i];mixNext[i]=t==='add'?'sub':'add'}
 const used=drawCounts[i]++;
 // 以 100 題為一輪，隨機安排其中 3 題含 0；前 33 題至多 1 題。
 const slot=used%100;
 if(slot===0)zeroSlots[i]=makeZeroSlots();
 const allowZero=zeroSlots[i].includes(slot);
 if(!decks[i].some(q=>q.kind===t&&q.zero===allowZero)){
  const retained=decks[i].filter(q=>q.kind!==t||q.zero!==allowZero);
  decks[i]=retained.concat(buildPool(t).filter(q=>q.zero===allowZero));
 }
 let candidates=decks[i].map((q,index)=>({q,index})).filter(x=>x.q.kind===t&&x.q.zero===allowZero);
 const recent=recentAnswers[i],previous=recentProblems[i];
 // 先避開另一位玩家剛看到的題目及近期相同答案，再從最高分候選題隨機抽選。
 function rank(x){let n=0;
  if(x.q.core)n+=9;
  if(!recent.includes(x.q.ans))n+=18;
  if(!previous.includes(x.q.txt))n+=22;
  if(!globalRecent.includes(x.q.txt))n+=15;
  if(questions[1-i]&&questions[1-i].txt===x.q.txt)n-=40;
  return n+Math.random()*15;
 }
 candidates.forEach(x=>x.priority=rank(x));candidates.sort((x,y)=>y.priority-x.priority);
 const chosen=candidates[0];decks[i].splice(chosen.index,1);
 recent.push(chosen.q.ans);if(recent.length>5)recent.shift();
 previous.push(chosen.q.txt);if(previous.length>15)previous.shift();
 globalRecent.push(chosen.q.txt);if(globalRecent.length>18)globalRecent.shift();
 if(chosen.q.zero)zeroCounts[i]++;
 return {txt:chosen.q.txt,ans:chosen.q.ans};
}
function renderInput(i){$('a'+(i?'R':'L')).textContent=inputs[i]||'　'}
function newQuestion(i){questions[i]=question(i);inputs[i]='';$('q'+(i?'R':'L')).textContent=questions[i].txt;renderInput(i);$('s'+(i?'R':'L')).textContent='請輸入答案'}
function flash(i,correct){const el=$(i?'flashR':'flashL');el.classList.remove('show','correct','wrong');el.querySelector('.feedback-symbol').textContent=correct?'◯':'✕';el.classList.add(correct?'correct':'wrong');void el.offsetWidth;el.classList.add('show');playSound(correct)}
function key(i,k){if(!active||(mode==='solo'&&i!==0)||(mode==='cpu'&&i!==1))return;const side=i?'R':'L';if(k==='C'){inputs[i]='';renderInput(i);return}if(k==='OK'){if(inputs[i]==='')return;const correct=Number(inputs[i])===questions[i].ans;flash(i,correct);if(correct){scores[i]++;pos+=i?1:-1;newQuestion(i);$('s'+side).textContent='🎉 答對了！'}else{$('s'+side).textContent='再試一次！';inputs[i]='';renderInput(i)}update();if(Math.abs(pos)>=10)finish();return}if(inputs[i].length<2){inputs[i]+=k;renderInput(i)}}
function update(){const names=mode==='solo'?['⭐ 答對','🎯 目標']:mode==='cpu'?['🤖 電腦','🧒 玩家']:['🔵 玩家一','🔴 玩家二'];$('scoreL').textContent=`${names[0]}：${scores[0]}`;$('scoreR').textContent=mode==='solo'?'繼續加油！':`${names[1]}：${scores[1]}`;$('tugGroup').style.transform=`translateX(${Math.max(-10,Math.min(10,pos))*3.1}%)`;$('clock').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0')}
function finish(){if(!active)return;active=false;clearInterval(timer);clearTimeout(cpuTimer);let title,detail;if(mode==='solo'){title='🌟 挑戰完成！';detail=`你答對了 ${scores[0]} 題！`}else if(scores[0]===scores[1]){title='🤝 平手！';detail=`雙方都答對 ${scores[0]} 題！`}else{const w=scores[0]>scores[1]?0:1;title=w?(mode==='cpu'?'🏆 玩家獲勝！':'🏆 玩家二獲勝！'):'🏆 '+(mode==='cpu'?'電腦':'玩家一')+'獲勝！';detail=`${mode==='cpu'?'電腦':'玩家一'} ${scores[0]} 題・${mode==='cpu'?'玩家':'玩家二'} ${scores[1]} 題`}$('resultTitle').textContent=title;$('resultText').textContent=detail;$('result').style.display='block'}
function cpuMove(){if(!active||mode!=='cpu')return;const delay={easy:5500,normal:3500,hard:2200}[config.difficulty];cpuTimer=setTimeout(()=>{if(!active)return;if(Math.random()<.87){flash(0,true);scores[0]++;pos--;newQuestion(0);$('sL').textContent='🤖 電腦答對一題！';update();if(Math.abs(pos)>=10){finish();return}}else{flash(0,false)}cpuMove()},delay)}
function startGame(){clearInterval(timer);clearTimeout(cpuTimer);decks=[[],[]];recentAnswers=[[],[]];recentProblems=[[],[]];mixNext=shuffle(['add','sub']);drawCounts=[0,0];zeroCounts=[0,0];globalRecent=[];zeroSlots=[[],[]];mode=config.mode;active=true;remaining=Number(config.duration);scores=[0,0];pos=0;$('result').style.display='none';for(const id of ['flashL','flashR'])$(id).classList.remove('show');$('rightPanel').classList.toggle('hide',mode==='solo');$('boards').classList.toggle('cpu-layout',mode==='cpu');$('boards').classList.toggle('solo-layout',mode==='solo');$('nameL').textContent=mode==='solo'?'⭐ 個人挑戰':mode==='cpu'?'🤖 電腦':'🔵 玩家一';$('nameR').textContent=mode==='cpu'?'🧒 玩家':'🔴 玩家二';$('teamL').textContent=mode==='cpu'?'🤖🤖':'👦🏻👧🏼';$('teamR').textContent='👧🏻👦🏼';$('keysL').classList.toggle('hide',mode==='cpu');$('aL').classList.toggle('hide',mode==='cpu');$('keysR').classList.toggle('hide',mode==='solo');$('aR').classList.remove('hide');$('sL').textContent=mode==='cpu'?'電腦自動作答中…':'準備開始';$('sR').textContent='準備開始';$('tip').textContent=mode==='solo'?'限時挑戰：看看你能答對幾題！':mode==='cpu'?'左邊是電腦、右邊是玩家，兩邊一起拔河！':'左右兩邊可以同時觸控作答，不必輪流！';newQuestion(0);newQuestion(1);if(mode==='cpu')$('sL').textContent='🤖 電腦自動作答中…';update();timer=setInterval(()=>{remaining=Math.max(0,remaining-1);update();if(remaining<=0)finish()},1000);if(mode==='cpu')cpuMove()}
for(let i=0;i<2;i++){const box=$('keys'+(i?'R':'L'));for(const k of ['1','2','3','4','5','6','7','8','9','C','0','OK']){const b=document.createElement('button');b.type='button';b.textContent=k==='C'?'✕':k==='OK'?'✓':k;b.className=k==='C'?'clear':k==='OK'?'ok':'';b.addEventListener('pointerdown',e=>{if(e.pointerType){e.preventDefault();key(i,k)}});b.addEventListener('click',e=>{if(!window.PointerEvent||e.detail===0)key(i,k)});box.append(b)}}
document.querySelectorAll('.options').forEach(group=>group.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{const field=group.dataset.group;config[field]=btn.dataset.value;group.querySelectorAll('button').forEach(b=>b.classList.toggle('selected',b===btn));if(field==='mode')$('difficultyGroup').classList.toggle('hide',config.mode!=='cpu');if(field==='duration'&&!active){remaining=Number(config.duration);update()}})));
$('difficultyGroup').classList.add('hide');$('start').addEventListener('click',startGame);$('again').addEventListener('click',startGame);
document.addEventListener('keydown',e=>{if(!active||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;const k=e.key;const side=mode==='cpu'?1:0;if(/^[0-9]$/.test(k))key(side,k);else if(k==='Enter')key(side,'OK');else if(k==='Backspace')key(side,'C')});update();
</script></body></html>
